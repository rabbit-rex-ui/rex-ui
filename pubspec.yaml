name: rabbit_pdv
description: "Rabbit PDV — Frente de caixa online-first do Rabbit ERP."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # DI + módulos. Usado apenas como container, sem acoplar controllers a ele.
  flutter_modular: ^6.3.4

  # HTTP. Interceptors para auth, retry e logging.
  dio: ^5.7.0

  # Persistência local (SQLite) — apenas catálogo. Habilitar no passo de cache.
  # drift: ^2.20.0
  # drift_flutter: ^0.2.0
  # sqlite3_flutter_libs: ^0.5.24

  # Preferências e secrets locais.
  shared_preferences: ^2.3.2

  # Diretórios canônicos por plataforma (logs, dados, cache).
  path_provider: ^2.1.5

  # Iconografia stroke-pure que casa com o design.
  lucide_icons_flutter: ^3.0.5

  # Utilitários.
  collection: ^1.18.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  # Logger leve.
  logging: ^1.3.0

  # Lock de single-flight no refresh de token.
  synchronized: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # Fontes locais (recomendado pelo doc — sem rede em runtime).
  # Baixar os .ttf de https://fonts.google.com e colocar em assets/fonts/.
  # Após baixar, descomentar abaixo:
  #
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: JetBrainsMono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/JetBrainsMono-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700